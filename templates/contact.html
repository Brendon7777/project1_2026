<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --primary: #2f6fed;
            --primary-dark: #1f52ba;
            --text: #1f2937;
            --muted: #6b7280;                           
            --border: #dfe7f5;
            --shadow: rgba(31, 41, 55, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef4ff, var(--bg));
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .contact-card {
            width: min(100%, 760px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 40px var(--shadow);
            overflow: hidden;
        }

        .contact-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 32px 28px;
        }

        .contact-header h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 4vw, 2.8rem);
        }

        .contact-header p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.9;
        }

        .contact-body {
            display: grid;
            grid-template-columns: 1.05fr 1.35fr;
            gap: 0;
        }

        .info-panel {
            background: #f8fbff;
            padding: 32px 28px;
            border-right: 1px solid var(--border);
        }

        .info-item {
            margin-bottom: 22px;
        }

        .info-item h3 {
            margin: 0 0 8px;
            font-size: 1rem;
            color: var(--text);
        }

        .info-item p,
        .info-item a {
            margin: 0;
            color: var(--muted);
            text-decoration: none;
            line-height: 1.6;
        }

        .info-item a:hover {
            color: var(--primary);
        }

        .form-panel {
            padding: 32px 28px;
        }

        form {
            display: grid;
            gap: 18px;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            font-size: 0.92rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 1rem;
            color: var(--text);
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.12);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        @media (max-width: 640px) {
            .contact-body {
                grid-template-columns: 1fr;
            }

            .info-panel {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .field-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="contact-card">
        <div class="contact-header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you. Send us a message and we'll get back to you soon.</p>
        </div>

        <div class="contact-body">
            <aside class="info-panel">
                <div class="info-item">
                    <h3>Email</h3>
                    <a href="mailto:hello@example.com">hello@example.com</a>
                </div>

                <div class="info-item">
                    <h3>Phone</h3>
                    <p>+1 (555) 123-4567</p>
                </div>

                <div class="info-item">
                    <h3>Office</h3>
                    <p>123 Business Avenue<br />New York, NY 10001</p>
                </div>
            </aside>

            <section class="form-panel">
                <form>
                    <div class="field-row">
                        <div>
                            <label for="first-name">First Name</label>
                            <input id="first-name" type="text" name="firstName" placeholder="John" />
                        </div>
                        <div>
                            <label for="last-name">Last Name</label>
                            <input id="last-name" type="text" name="lastName" placeholder="Doe" />
                        </div>
                    </div>

                    <div>
                        <label for="email">Email Address</label>
                        <input id="email" type="email" name="email" placeholder="john@example.com" />
                    </div>

                    <div>
                        <label for="subject">Subject</label>
                        <input id="subject" type="text" name="subject" placeholder="How can we help?" />
                    </div>

                    <div>
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Write your message here..."></textarea>
                    </div>

                    <button type="submit">Send Message</button>
                </form>
            </section>
        </div>
    </div>
</body>
</html>
